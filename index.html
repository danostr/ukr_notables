<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notable People of Ukraine</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
    
    <style>
        body { margin: 0; padding: 0; }
        #map { height: 100vh; width: 100vw; }
    </style>
</head>
<body>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
    
    <script>
    var map = L.map('map').setView([48.3794, 31.1656], 6);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    var markers = L.markerClusterGroup();

    console.log("Starting to fetch data...");

    // Point to the new high-quality file
    fetch('data/people_with_wiki.json')
        .then(response => response.json())
        .then(people => {
            console.log("High-quality data loaded:", people.length);
            
            people.forEach((person) => {
                if (person.coords) {
                    const match = person.coords.match(/Point\(([^ ]+) ([^ ]+)\)/);
                    if (match) {
                        const lon = parseFloat(match[1]);
                        const lat = parseFloat(match[2]);

                        const occupations = person.occupations || [];
                        const occupationText = occupations.length > 0 ? occupations.join(', ') : "Information not available";

                        // Build links (Now we know at least one will exist)
                        let wikiLinksHTML = "";
                        if (person.enWiki) wikiLinksHTML += `<a href="${person.enWiki}" target="_blank" style="margin-right:10px;">🇬🇧 English</a>`;
                        if (person.ukWiki) wikiLinksHTML += `<a href="${person.ukWiki}" target="_blank" style="margin-right:10px;">🇺🇦 Ukrainian</a>`;
                        if (person.ruWiki) wikiLinksHTML += `<a href="${person.ruWiki}" target="_blank">🇷🇺 Russian</a>`;

                        const popupContent = `
                            <div style="font-family: sans-serif; min-width: 220px;">
                                <h3 style="margin: 0 0 5px 0; color: #2c3e50;">${person.name}</h3>
                                <p style="margin: 5px 0;"><b>Birthplace:</b> ${person.birthplace}</p>
                                <p style="margin: 5px 0;"><b>Occupation:</b> <span style="color: #7f8c8d;">${occupationText}</span></p>
                                <hr style="border: 0; border-top: 1px solid #eee;">
                                <div style="margin-top: 10px;">
                                    <b>Read biography:</b><br>
                                    <div style="margin-top: 5px;">${wikiLinksHTML}</div>
                                </div>
                            </div>
                        `;

                        const singleMarker = L.marker([lat, lon]).bindPopup(popupContent);
                        markers.addLayer(singleMarker);
                    }
                }
            });
            
            map.addLayer(markers);
            if (markers.getLayers().length > 0) {
                map.fitBounds(markers.getBounds());
            }
        });
</script>

</body>
</html>
