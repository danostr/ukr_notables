<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notable People of Ukraine</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
    
    <style>
        body { margin: 0; padding: 0; }
        #map { height: 100vh; width: 100vw; }
    </style>
</head>
<body>

    <div id="map"></div>

    <div id="filter-container" style="position: absolute; top: 20px; right: 20px; z-index: 1000; background: white; padding: 15px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.2);">
    <label for="topic-filter"><b>Main Category:</b></label><br>
    <select id="topic-filter" style="width: 200px; margin-top: 5px; margin-bottom: 10px; padding: 5px;">
        <option value="all">All People (76k)</option>
        <option value="Politics & Society">Politics & Society</option>
        <option value="Arts & Culture">Arts & Culture</option>
        <option value="Science & Education">Science & Education</option>
        <option value="Medicine">Medicine</option>
        <option value="Sports">Sports</option>
        <option value="Military">Military</option>
        <option value="Business & Labor">Business & Labor</option>
        <option value="Other">Other / Unknown</option>
    </select>
    
    <br>
    
    <label id="sub-topic-label" for="sub-topic-filter" style="display: none;"><b>Sub-Category:</b></label><br>
    <select id="sub-topic-filter" style="width: 200px; margin-top: 5px; padding: 5px; display: none;">
        </select>
</div>


    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
    
    <script>
        // 1. Wrap absolutely everything in the DOMContentLoaded listener
        document.addEventListener('DOMContentLoaded', function() {
            
            // --- MAP INITIALIZATION ---
            var map = L.map('map').setView([48.3794, 31.1656], 6);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '© OpenStreetMap contributors'
            }).addTo(map);

            var markers = L.markerClusterGroup();
            let allPeople = []; // Storage for filtering

            // --- FILTER DATA & DOM ELEMENTS ---
            const subTopicsMap = {
                "Politics & Society": ["All", "Government & Law", "Religion", "Activism & Media"],
                "Arts & Culture": ["All", "Literature", "Visual Arts", "Performing Arts", "Music", "TV & Internet Influencer", "Cinema & Filmmaking"],
                "Science & Education": ["All", "Science & Math", "Humanities", "Education", "Engineering & Tech"],
                "Medicine": ["All", "Healthcare"],
                "Sports": ["All", "Football", "Combat Sports", "Athletics & Gymnastics", "Winter Sports", "Water Sports", "Other Sports"],
                "Military": ["All", "Armed Forces"],
                "Business & Labor": ["All", "Business", "Transport & Aviation", "Labor & Agriculture"],
                "Other": ["All", "Unknown"]
            };

            const mainFilter = document.getElementById('topic-filter');
            const subFilter = document.getElementById('sub-topic-filter');
            const subLabel = document.getElementById('sub-topic-label');

            // --- RENDER FUNCTION ---
            // (Moved up so the event listeners and fetch can use it)
            function renderMarkers() {
                // Read current values directly from the dropdowns
                const mainTopic = mainFilter.value;
                const subTopic = subFilter.value;
                
                console.log(`Filtering for: ${mainTopic} > ${subTopic || 'All'}`);
                markers.clearLayers(); 

                allPeople.forEach(person => {
                    // Filter by Main Topic
                    if (mainTopic !== 'all' && person.topic !== mainTopic) return;
                    
                    // Filter by Sub Topic
                    if (mainTopic !== 'all' && subTopic && subTopic !== 'All' && person.sub_topic !== subTopic) return;

                    const match = person.coords.match(/Point\(([^ ]+) ([^ ]+)\)/);
                    if (match) {
                        const lon = parseFloat(match[1]);
                        const lat = parseFloat(match[2]);

                        let wikiLinksHTML = "";
                        if (person.enWiki) wikiLinksHTML += `<a href="${person.enWiki}" target="_blank" style="text-decoration:none;">🇬🇧</a> `;
                        if (person.ukWiki) wikiLinksHTML += `<a href="${person.ukWiki}" target="_blank" style="text-decoration:none;">🇺🇦</a> `;
                        if (person.ruWiki) wikiLinksHTML += `<a href="${person.ruWiki}" target="_blank" style="text-decoration:none;">🇷🇺</a> `;

                        // Safely handle missing occupations or sub_topics
                        const subTopicText = (person.sub_topic && person.sub_topic !== 'Unknown') ? ` > ${person.sub_topic}` : '';
                        const occupationsText = (person.occupations && person.occupations.length > 0) ? person.occupations.join(', ') : '<i>Not specified</i>';

                        const popupContent = `
                            <div style="font-family: sans-serif; min-width: 220px;">
                                <h3 style="margin: 0 0 5px 0; color: #0057b7;">${person.name}</h3>
                                <p style="margin: 2px 0;"><b>Birthplace:</b> ${person.birthplace}</p>
                                <p style="margin: 2px 0;"><b>Category:</b> <span style="color: #666;">${person.topic}${subTopicText}</span></p>
                                <p style="margin: 2px 0;"><b>Occupation:</b> ${occupationsText}</p>
                                <hr style="border: 0; border-top: 1px solid #eee; margin: 10px 0;">
                                <div style="display: flex; gap: 15px; font-size: 1.2em;">${wikiLinksHTML}</div>
                            </div>
                        `;

                        const marker = L.marker([lat, lon]).bindPopup(popupContent);
                        markers.addLayer(marker);
                    }
                });

                map.addLayer(markers);
                console.log(`Markers updated: ${markers.getLayers().length} people visible.`);
            }

            // --- EVENT LISTENERS ---
            // Handle Main Filter Changes
            mainFilter.addEventListener('change', function(e) {
                const selectedMain = e.target.value;
                
                // Reset and populate the sub-filter
                subFilter.innerHTML = ''; 
                
                if (selectedMain !== 'all' && subTopicsMap[selectedMain]) {
                    // Show the sub-filter
                    subFilter.style.display = 'block';
                    subLabel.style.display = 'inline-block';
                    
                    // Add the specific sub-topics
                    subTopicsMap[selectedMain].forEach(st => {
                        const opt = document.createElement('option');
                        opt.value = st;
                        opt.innerText = st === 'All' ? `All in ${selectedMain}` : st;
                        subFilter.appendChild(opt);
                    });
                } else {
                    // Hide the sub-filter if "All People" is chosen
                    subFilter.style.display = 'none';
                    subLabel.style.display = 'none';
                }
                
                // Re-render the map immediately after changing the main topic!
                renderMarkers(); 
            });

            // Handle Sub Filter Changes (Now safely outside the main listener!)
            subFilter.addEventListener('change', function() {
                renderMarkers();
            });

            // --- FETCH DATA ---
            console.log("Fetching categorized data...");
            fetch('data/map_data_with_topics.json')
                .then(response => response.json())
                .then(data => {
                    allPeople = data;
                    console.log("Data loaded. Total:", allPeople.length);
                    renderMarkers(); // Initial render
                })
                .catch(err => console.error("Error loading JSON:", err));
        });
    </script>

</body>
</html>
