<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notable People of Ukraine</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
    
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <div id="cluster-list-panel">
        <div class="panel-header" style="flex-direction: column; align-items: flex-start;">
            <div style="display: flex; justify-content: space-between; width: 100%; align-items: center;">
                <h2 id="panel-title" style="margin:0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Location Name</h2>
                <span class="close-panel" onclick="closeAllPanels()">&times;</span>
            </div>
            <div id="panel-subtitle" style="font-size: 0.85em; opacity: 0.9; margin-top: 4px;">0 People Here</div>
        </div>
        <div id="list-content"></div>
    </div>

    <div id="person-detail-panel">
        <div class="panel-header">
            <h2 id="detail-name" style="margin:0;">Name</h2>
            <span class="close-panel" onclick="document.getElementById('person-detail-panel').classList.remove('open')">&times;</span>
        </div>
        <div id="detail-content"></div>
    </div>

    <div id="map"></div>

    <div id="filter-container">
        <button id="theme-toggle">🌙 Switch to Dark Mode</button>
        <hr style="border: 0; border-top: 1px solid #ddd; margin: 15px 0;">

        <label for="topic-filter"><b>Main Category:</b></label><br>
        <select id="topic-filter">
            <option value="all">All People (76k)</option>
            <option value="Politics & Society">Politics & Society</option>
            <option value="Arts & Culture">Arts & Culture</option>
            <option value="Science & Education">Science & Education</option>
            <option value="Medicine">Medicine</option>
            <option value="Sports">Sports</option>
            <option value="Military">Military</option>
            <option value="Business & Labor">Business & Labor</option>
            <option value="Other">Other / Unknown</option>
        </select>
        
        <br>
        
        <label id="sub-topic-label" for="sub-topic-filter" style="display: none;"><b>Sub-Category:</b></label><br>
        <select id="sub-topic-filter" style="display: none;"></select>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
    <script src="app.js"></script>
</body>
</html>
